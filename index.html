  ">

    font-family: Consolas, monospace;

<script>

let clockRunningLED = false;
let blinkLED = true;

function startClockLED() {

  if (clockRunningLED) return;
  clockRunningLED = true;

  function updateClockLED() {

    const now = new Date();

    let h = now.getHours().toString().padStart(2,'0');
    let m = now.getMinutes().toString().padStart(2,'0');
    let s = now.getSeconds().toString().padStart(2,'0');

    let d = now.getDate().toString().padStart(2,'0');
    let mo = (now.getMonth()+1).toString().padStart(2,'0');
    let y = now.getFullYear();

    let colon = blinkLED ? ":" : " ";
    blinkLED = !blinkLED;

    document.getElementById("clockLED").innerHTML =
      h + colon + m + colon + s;

    document.getElementById("dateLED").innerHTML =
      d + "." + mo + "." + y;
  }

  updateClockLED();
  setInterval(updateClockLED, 500);

}

</script>
