<script>

/* ANALOG ROTATE */

function rotate(el,deg){

el.setAttribute(
"transform",
`rotate(${deg} 100 100)`
);

}

function update(){

const now = new Date();

/* TIME PARTS */

const h = now.getHours();
const m = now.getMinutes();
const s = now.getSeconds();
const ms = now.getMilliseconds();

/* DIGITAL WITH MILLISECOND */

clock.innerHTML =
h.toString().padStart(2,"0")+":"+
m.toString().padStart(2,"0")+":"+
s.toString().padStart(2,"0")+"."+
ms.toString().padStart(3,"0");

/* DATE */

date.innerHTML =
now.toLocaleDateString("tr-TR",{
weekday:"long",
day:"2-digit",
month:"long",
year:"numeric"
});

/* ANALOG SMOOTH */

rotate(hour,(h%12)*30 + m*0.5);

rotate(minute,m*6 + s*0.1);

rotate(second,(s*6) + (ms*0.006));

/* ZONES */

const zones = {

tr:["🇹🇷 Türkiye","Europe/Istanbul"],
lon:["🇬🇧 London","Europe/London"],
kos:["🇽🇰 Kosova","Europe/Belgrade"],
utc:["🌍 UTC","UTC"],
ny:["🇺🇸 New York","America/New_York"],
tok:["🇯🇵 Tokyo","Asia/Tokyo"]

};

for(let id in zones){

document.getElementById(id).innerHTML =
zones[id][0] + "<br>" +
now.toLocaleTimeString("tr-TR",{
timeZone:zones[id][1],
hour12:false
});

}

/* BORSA */

function openCheck(tz,start,end){

const hour = parseInt(
now.toLocaleTimeString("en-US",{
timeZone:tz,
hour:"2-digit",
hour12:false
})
);

return hour>=start && hour<end;

}

borsa.innerHTML =

"🇹🇷 BIST: " +
(openCheck("Europe/Istanbul",10,18) ?
"<span class=open>AÇIK</span>" :
"<span class=closed>KAPALI</span>")

+

" | 🇬🇧 LSE: " +
(openCheck("Europe/London",8,16) ?
"<span class=open>AÇIK</span>" :
"<span class=closed>KAPALI</span>")

+

" | 🇺🇸 NYSE: " +
(openCheck("America/New_York",9,16) ?
"<span class=open>AÇIK</span>" :
"<span class=closed>KAPALI</span>")

+

" | 🇯🇵 TSE: " +
(openCheck("Asia/Tokyo",9,15) ?
"<span class=open>AÇIK</span>" :
"<span class=closed>KAPALI</span>")

+

" | 🇽🇰 KOSOVA: " +
(openCheck("Europe/Belgrade",9,17) ?
"<span class=open>AÇIK</span>" :
"<span class=closed>KAPALI</span>")
;

}

/* 60 FPS UPDATE */

setInterval(update,16);

update();

</script>


<script>

let clockRunningLED = false;
let blinkLED = true;

function startClockLED() {

  if (clockRunningLED) return;
  clockRunningLED = true;

  function updateClockLED() {

    const now = new Date();

    let h = now.getHours().toString().padStart(2,'0');
    let m = now.getMinutes().toString().padStart(2,'0');
    let s = now.getSeconds().toString().padStart(2,'0');

    let d = now.getDate().toString().padStart(2,'0');
    let mo = (now.getMonth()+1).toString().padStart(2,'0');
    let y = now.getFullYear();

    let colon = blinkLED ? ":" : " ";
    blinkLED = !blinkLED;

    document.getElementById("clockLED").innerHTML =
      h + colon + m + colon + s;

    document.getElementById("dateLED").innerHTML =
      d + "." + mo + "." + y;
  }

  updateClockLED();
  setInterval(updateClockLED, 500);

}

</script>
